name: Update Major Minor Tags

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-tags
  cancel-in-progress: false

jobs:
  update-major-minor-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move major/minor tags
        shell: bash
        run: bash scripts/update-tags.sh
